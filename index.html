<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <title>GA Pokémon</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view"></main>

  <nav id="nav">
    <a href="#/" data-tab="home"><span>◓</span>Espansioni</a>
    <a href="#/stats" data-tab="stats"><span>▤</span>Collezione</a>
    <a href="#/album" data-tab="album"><span>▦</span>Album</a>
    <a href="#/wish" data-tab="wish"><span>★</span>Wishlist</a>
    <a href="#/more" data-tab="more"><span>⚙</span>Altro</a>
  </nav>

  <dialog id="sheet"></dialog>

  <div id="packbar" hidden></div>

  <dialog id="packDialog">
    <div class="sheet-head">
      <div><h2>Apri una bustina</h2><small>Le carte che aggiungi finiscono in questa bustina finché non tocchi Fine</small></div>
      <button class="icon" data-close-pack aria-label="Chiudi">✕</button>
    </div>
    <form id="packForm">
      <label>Set della bustina <select id="packSet"></select></label>
      <label>Prezzo pagato (€) <input id="packPrice" inputmode="decimal" placeholder="es. 5,50"></label>
      <button class="primary">Inizia</button>
    </form>
  </dialog>

  <dialog id="scanner">
    <div class="sheet-head">
      <div><h2>Scansiona una carta</h2><small>Carta dritta dentro il riquadro, con buona luce</small></div>
      <button class="icon" data-close-scan aria-label="Chiudi">✕</button>
    </div>
    <div class="scan-view">
      <video playsinline muted></video>
      <div class="frame"></div>
    </div>
    <div class="scan-actions">
      <button class="primary" data-shot>Scatta e riconosci</button>
      <label class="chip">Usa una foto<input type="file" accept="image/*" id="scanFile" hidden></label>
    </div>
    <label class="burst"><input type="checkbox" id="scanBurst"> Raffica: aggiungi da sola le carte riconosciute con sicurezza</label>
    <p class="note" id="scanMsg"></p>
    <form id="scanFix" hidden>
      <input id="scanNumber" inputmode="text" autocomplete="off" placeholder="Numero giusto, es. 81/198">
      <button class="chip">Cerca</button>
    </form>
    <div id="scanResults"></div>
    <div id="scanLog"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
